<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>おとループ</title>
  <style>
    :root {
      --bg-color: #f7f9fc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --record-color: #ef4444;
      --record-gradient: linear-gradient(135deg, #f87171, #dc2626);
      --play-color: #059669;
      --play-gradient: linear-gradient(135deg, #34d399, #059669);
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", Meiryo, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 24px;
      touch-action: manipulation;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-top: 6px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #0f172a;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 500;
    }

    /* メイン表示領域 */
    .stage {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto 0;
    }

    .ripple-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      box-sizing: border-box;
    }

    .recording .ripple-ring {
      border: 3px solid var(--record-color);
      animation: ripplePulse 1.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    .playing .ripple-ring {
      border: 3px solid var(--play-color);
      animation: ripplePulse 1.6s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }

    @keyframes ripplePulse {
      0% {
        transform: scale(0.85);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    .progress-svg {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 290px;
      height: 290px;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .progress-track {
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 8;
    }

    .progress-bar {
      fill: none;
      stroke: var(--record-color);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 848.2;
      stroke-dashoffset: 848.2;
      transition: stroke-dashoffset 0.1s linear;
    }

    /* メイン操作ボタン */
    .main-button {
      position: relative;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.06);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      z-index: 10;
      pointer-events: auto;
    }

    .main-button:active {
      transform: scale(0.93);
    }

    .btn-record-ready {
      background: var(--record-gradient);
      color: #ffffff;
    }

    .btn-recording {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      animation: recordGlow 1.2s ease-in-out infinite alternate;
    }

    @keyframes recordGlow {
      from { box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35); }
      to { box-shadow: 0 16px 48px rgba(239, 68, 68, 0.7); }
    }

    .btn-play-ready {
      background: var(--play-gradient);
      color: #ffffff;
    }

    .btn-playing {
      background: linear-gradient(135deg, #10b981, #047857);
      color: #ffffff;
      animation: playGlow 1.4s ease-in-out infinite alternate;
    }

    @keyframes playGlow {
      from { box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35); }
      to { box-shadow: 0 16px 48px rgba(16, 185, 129, 0.7); }
    }

    .button-icon {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      pointer-events: none;
    }

    .button-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .button-label {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .button-sublabel {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 4px;
      font-weight: 600;
      pointer-events: none;
    }

    .status-area {
      text-align: center;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-detail {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .footer-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .sub-button {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: background-color 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .sub-button:active {
      background: #f1f5f9;
      transform: scale(0.97);
    }

    .sub-button.hidden {
      display: none;
    }

    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .volume-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
    }

    .volume-slider {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
    }

    .notice-text {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
      margin-top: 2px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .modal-text {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .modal-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">おとループ</div>
    <div class="subtitle">おとを とって、みんなで ならそう</div>
  </header>

  <!-- 中央ステージ -->
  <div class="stage" id="stage">
    <div class="ripple-ring"></div>

    <!-- 録音プログレスリング -->
    <svg class="progress-svg" viewBox="0 0 290 290">
      <circle class="progress-track" cx="145" cy="145" r="135"></circle>
      <circle class="progress-bar" id="progressBar" cx="145" cy="145" r="135"></circle>
    </svg>

    <!-- メイン操作ボタン -->
    <button class="main-button btn-record-ready" id="mainButton">
      <div class="button-icon" id="buttonIcon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle></svg>
      </div>
      <div class="button-label" id="buttonLabel">おとをとる</div>
      <div class="button-sublabel" id="buttonSubLabel">タップしてスタート</div>
    </button>
  </div>

  <!-- 状態表示 -->
  <div class="status-area">
    <div class="status-text" id="statusText">ボタンをおしてね</div>
    <div class="status-detail" id="statusDetail">すきなおとを まわりから さがそう</div>
  </div>

  <!-- 下部操作ボタン・音量 -->
  <div class="footer-actions">
    <!-- 再録音ボタン -->
    <button class="sub-button hidden" id="reRecordButton">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      べつの おとを とる
    </button>

    <!-- 音量調整 -->
    <div class="volume-box">
      <span class="volume-label">おとのおおきさ</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1.0">
    </div>

    <!-- 注意事項（iPhoneマナーモード等） -->
    <div class="notice-text">
      ※音が鳴らない・小さいときはiPhoneの消音モード（マナーモード）をオフにし、音量を上げてください。
    </div>
  </div>

  <!-- エラー案内モーダル -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">マイクをつかいます</div>
      <div class="modal-text" id="modalText">ブラウザの「マイクの使用を許可」をおしてください。</div>
      <button class="modal-btn" id="modalClose">わかりました</button>
    </div>
  </div>

  <script>
    let appState = 'IDLE';

    const MAX_RECORD_SECONDS = 10;
    let recordStartTime = 0;
    let recordTimer = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let currentStream = null;
    let audioContext = null;
    let audioBuffer = null;
    let sourceNode = null;
    let gainNode = null;
    let wakeLock = null;

    const stage = document.getElementById('stage');
    const mainButton = document.getElementById('mainButton');
    const buttonIcon = document.getElementById('buttonIcon');
    const buttonLabel = document.getElementById('buttonLabel');
    const buttonSubLabel = document.getElementById('buttonSubLabel');
    const statusText = document.getElementById('statusText');
    const statusDetail = document.getElementById('statusDetail');
    const progressBar = document.getElementById('progressBar');
    const reRecordButton = document.getElementById('reRecordButton');
    const volumeSlider = document.getElementById('volumeSlider');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalClose = document.getElementById('modalClose');

    const CIRCUMFERENCE = 2 * Math.PI * 135; // 848.23
    progressBar.style.strokeDasharray = CIRCUMFERENCE;
    progressBar.style.strokeDashoffset = CIRCUMFERENCE;

    const ICONS = {
      record: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle></svg>',
      stopRecord: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>',
      play: '<svg viewBox="0 0 24 24"><polygon points="7,5 19,12 7,19"></polygon></svg>',
      pause: '<svg viewBox="0 0 24 24"><line x1="8" y1="5" x2="8" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="16" y1="5" x2="16" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>'
    };

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; }).catch(() => {});
      }
    }

    function initAudioContext() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!audioContext || audioContext.state === 'closed') {
          audioContext = new AudioCtx();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
        if (!gainNode) {
          gainNode = audioContext.createGain();
          gainNode.gain.value = parseFloat(volumeSlider.value);
          gainNode.connect(audioContext.destination);
        }
      } catch (e) {
        console.warn('AudioContext初期化エラー:', e);
      }
    }

    function resetToSpeakerModeAsync() {
      try {
        const audio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        audio.play().then(() => {
          audio.pause();
        }).catch(() => {});
      } catch (e) {}
    }

    volumeSlider.addEventListener('input', (e) => {
      const vol = parseFloat(e.target.value);
      if (gainNode && audioContext) {
        gainNode.gain.setValueAtTime(vol, audioContext.currentTime);
      }
    });

    mainButton.addEventListener('click', (e) => {
      e.preventDefault();
      initAudioContext();
      requestWakeLock();

      if (appState === 'IDLE') {
        startRecording();
      } else if (appState === 'RECORDING') {
        stopRecording();
      } else if (appState === 'READY') {
        startLoopPlayback();
      } else if (appState === 'PLAYING') {
        stopLoopPlayback();
      }
    });

    reRecordButton.addEventListener('click', (e) => {
      e.preventDefault();
      if (appState === 'PLAYING') {
        stopLoopPlayback();
      }
      setUIState('IDLE');
    });

    modalClose.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    async function startRecording() {
      setUIState('RECORDING');
      statusText.textContent = 'マイクをつないでいます...';

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          }
        });

        let mimeType = '';
        if (MediaRecorder.isTypeSupported('audio/mp4')) {
          mimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          mimeType = 'audio/webm;codecs=opus';
        } else if (MediaRecorder.isTypeSupported('audio/webm')) {
          mimeType = 'audio/webm';
        }

        const options = mimeType ? { mimeType } : {};
        mediaRecorder = new MediaRecorder(currentStream, options);
        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = async () => {
          if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
          }

          resetToSpeakerModeAsync();

          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/mp4' });
          await processRecordedAudio(blob);
        };

        mediaRecorder.start(100);
        recordStartTime = Date.now();
        updateProgress();

      } catch (err) {
        console.error('マイクアクセス失敗:', err);
        showModal('マイクがつかえません', 'マイクのきょかが ひつようです。ブラウザの設定でマイクをきょかしてください。');
        setUIState('IDLE');
      }
    }

    function updateProgress() {
      if (appState !== 'RECORDING') return;

      const elapsed = (Date.now() - recordStartTime) / 1000;
      const progress = Math.min(elapsed / MAX_RECORD_SECONDS, 1);
      const offset = CIRCUMFERENCE * (1 - progress);
      progressBar.style.strokeDashoffset = offset;

      const remaining = Math.max(0, Math.ceil(MAX_RECORD_SECONDS - elapsed));
      statusText.textContent = `ろくおん中（のこり ${remaining} びょう）`;

      if (elapsed >= MAX_RECORD_SECONDS) {
        stopRecording();
      } else {
        recordTimer = requestAnimationFrame(updateProgress);
      }
    }

    function stopRecording() {
      if (recordTimer) {
        cancelAnimationFrame(recordTimer);
        recordTimer = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    async function processRecordedAudio(blob) {
      statusText.textContent = 'おとを じゅんび中...';
      statusDetail.textContent = 'すこしだけ まってね';

      try {
        initAudioContext();
        const arrayBuffer = await blob.arrayBuffer();
        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        normalizeAudio(audioBuffer);
        applyMicroFade(audioBuffer);

        setUIState('READY');
      } catch (err) {
        console.error('デコードエラー:', err);
        showModal('おとが うまくとれませんでした', 'もういちど ろくおんボタンを おしてください。');
        setUIState('IDLE');
      }
    }

    function normalizeAudio(buffer) {
      let maxPeak = 0;
      for (let c = 0; c < buffer.numberOfChannels; c++) {
        const data = buffer.getChannelData(c);
        for (let i = 0; i < data.length; i++) {
          const val = Math.abs(data[i]);
          if (val > maxPeak) maxPeak = val;
        }
      }

      if (maxPeak > 0.001 && maxPeak < 0.95) {
        const multiplier = 0.95 / maxPeak;
        for (let c = 0; c < buffer.numberOfChannels; c++) {
          const data = buffer.getChannelData(c);
          for (let i = 0; i < data.length; i++) {
            data[i] *= multiplier;
          }
        }
      }
    }

    function applyMicroFade(buffer) {
      const sampleRate = buffer.sampleRate;
      const fadeDuration = 0.005;
      const fadeSamples = Math.floor(sampleRate * fadeDuration);

      for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
        const data = buffer.getChannelData(channel);
        const length = data.length;
        if (length <= fadeSamples * 2) continue;

        for (let i = 0; i < fadeSamples; i++) {
          data[i] *= (i / fadeSamples);
        }
        for (let i = 0; i < fadeSamples; i++) {
          data[length - 1 - i] *= (i / fadeSamples);
        }
      }
    }

    function startLoopPlayback() {
      if (!audioBuffer) return;

      initAudioContext();
      resetToSpeakerModeAsync();

      if (sourceNode) {
        try { sourceNode.stop(); sourceNode.disconnect(); } catch (e) {}
      }

      sourceNode = audioContext.createBufferSource();
      sourceNode.buffer = audioBuffer;
      sourceNode.loop = true;
      sourceNode.connect(gainNode);

      sourceNode.start(0);
      setUIState('PLAYING');
    }

    function stopLoopPlayback() {
      if (sourceNode) {
        try {
          sourceNode.stop();
          sourceNode.disconnect();
        } catch (e) {}
        sourceNode = null;
      }
      releaseWakeLock();
      setUIState('READY');
    }

    function setUIState(state) {
      appState = state;

      stage.classList.remove('recording', 'playing');
      mainButton.className = 'main-button';

      switch (state) {
        case 'IDLE':
          mainButton.classList.add('btn-record-ready');
          buttonIcon.innerHTML = ICONS.record;
          buttonLabel.textContent = 'おとをとる';
          buttonSubLabel.textContent = 'タップしてスタート';
          statusText.textContent = 'ボタンをおしてね';
          statusDetail.textContent = 'すきなおとを まわりから さがそう';
          progressBar.style.strokeDashoffset = CIRCUMFERENCE;
          reRecordButton.classList.add('hidden');
          break;

        case 'RECORDING':
          stage.classList.add('recording');
          mainButton.classList.add('btn-recording');
          buttonIcon.innerHTML = ICONS.stopRecord;
          buttonLabel.textContent = 'とめる';
          buttonSubLabel.textContent = 'もういちど タップ';
          statusDetail.textContent = 'おとを きいているよ...';
          reRecordButton.classList.add('hidden');
          break;

        case 'READY':
          mainButton.classList.add('btn-play-ready');
          buttonIcon.innerHTML = ICONS.play;
          buttonLabel.textContent = 'ならす';
          buttonSubLabel.textContent = 'ループさいせい';
          const duration = audioBuffer ? audioBuffer.duration.toFixed(1) : '0';
          statusText.textContent = `じゅんびOK！（${duration}びょう）`;
          statusDetail.textContent = '「ならす」をおすと ずっと音がくりかえすよ';
          progressBar.style.strokeDashoffset = CIRCUMFERENCE;
          reRecordButton.classList.remove('hidden');
          break;

        case 'PLAYING':
          stage.classList.add('playing');
          mainButton.classList.add('btn-playing');
          buttonIcon.innerHTML = ICONS.pause;
          buttonLabel.textContent = 'とめる';
          buttonSubLabel.textContent = 'タップでストップ';
          statusText.textContent = 'おとが なっているよ';
          statusDetail.textContent = 'みんなの音といっしょに きいてみよう';
          reRecordButton.classList.remove('hidden');
          break;
      }
    }

    function showModal(title, text) {
      modalTitle.textContent = title;
      modalText.textContent = text;
      modal.classList.add('active');
    }

    // 外部リンクを確実に外部ブラウザ（Safari）で開くためのハンドリング
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.href && link.origin !== window.location.origin) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    });
  </script>
</body>
</html>
